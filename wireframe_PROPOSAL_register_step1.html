<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otona Table - Registration Proposal Step 1</title>
    <style>
        :root {
            --primary: #4FD1C5;
            --primary-bg: #E6FFFA;
            --bg: #F8F9FA;
            --text-main: #2D3748;
            --text-sub: #718096;
            --border: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
        }

        header {
            height: 64px;
            background-color: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
        }

        .main-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .apply-container {
            background-color: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .progress-step {
            width: 40px;
            height: 4px;
            background-color: var(--border);
            border-radius: 2px;
        }

        .progress-step.active {
            background-color: var(--primary);
        }

        .section-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .section-subtitle {
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-size: 13px;
            font-weight: 700;
        }

        input {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            background-color: #FAFAFA;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .next-btn {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            margin-top: 24px;
        }

        .info-box {
            background-color: #fffaf0;
            border: 1px solid #feebc8;
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            color: #7b341e;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-logo">Otona Table</div>
    </header>

    <div class="main-container">
        <section class="apply-container">
            <div class="progress-bar">
                <div class="progress-step active"></div>
                <div class="progress-step"></div>
                <div class="progress-step"></div>
            </div>

            <h2 class="section-title">まずはアカウント作成</h2>
            <p class="section-subtitle">メールアドレスで簡単に登録いただけます。</p>

            <form>
                <div class="form-group">
                    <label>メールアドレス</label>
                    <input type="email" placeholder="example@mail.com">
                </div>

                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" placeholder="8文字以上の半角英数字">
                </div>

                <div class="form-group">
                    <label>パスワード（確認）</label>
                    <input type="password" placeholder="再度入力してください">
                </div>

                <a href="wireframe_PROPOSAL_register_step2.html" class="next-btn">本人確認へ進む</a>
            </form>

            <div class="info-box">
                ※ 本サービスは既婚者限定となっております。登録後の本人確認（KYC）が必須となりますのでご了承ください。
            </div>
        </section>
    </div>
</body>
</html>
