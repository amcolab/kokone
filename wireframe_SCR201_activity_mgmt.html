<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-201 Admin Activity Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }

    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .content-wrapper {
      max-width: 960px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 20px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 20px;
    }

    .table-wrapper {
      border: 1px solid #e0e0e0;
      background: #ffffff;
      overflow-x: auto;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .table th {
      border-bottom: 1px solid #e0e0e0;
      padding: 10px;
      text-align: left;
      font-weight: 600;
      background: #f5f5f5;
    }

    .table td {
      border-bottom: 1px solid #e0e0e0;
      padding: 10px;
      color: #424242;
    }

    .activity-type {
      font-size: 10px;
      padding: 2px 6px;
      border: 1px solid #e0e0e0;
      background: #f5f5f5;
      color: #757575;
    }

    .sidebar {
      width: 220px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-item {
      padding: 12px 16px;
      border-left: 3px solid transparent;
      color: #757575;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
    }

    .sidebar-item.active {
      border-left-color: #212121;
      background: #f5f5f5;
      color: #212121;
      font-weight: 600;
    }

    .sidebar-title {
      padding: 12px 16px;
      color: #424242;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 16px;
      margin-bottom: 4px;
    }

</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">ダッシュボード</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR200_admin_dashboard.html'">ダッシュボード</div>

  <div class="sidebar-title">管理</div>
  <div class="sidebar-item active" onclick="location.href='wireframe_SCR201_activity_mgmt.html'">アクティビティ</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR203_partner_mgmt.html'">店舗・パートナー管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR204_user_mgmt.html'">ユーザー管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR206_boshuu_mgmt.html'">募集管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR205_match_mgmt.html'">マッチング管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR210_booking_mgmt.html'">予約管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR220_report_mgmt.html'">通報管理</div>

  <div class="sidebar-title">業績</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR230_revenue.html'">収益管理</div>

  <div class="sidebar-title">システム</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR900_settings.html'">システム設定</div>
</div>

<div class="main-content">
  <div class="content-wrapper">
    <div class="page-title">アクティビティ管理</div>

    <div class="filter-bar">
      <input type="text" class="filter-input" placeholder="ユーザーID・名前で検索...">
      <select class="filter-select">
        <option>種別: すべて ▼</option>
        <option>Login</option>
        <option>Match</option>
        <option>Booking</option>
        <option>Profile Edit</option>
        <option>Identity</option>
      </select>
      <input type="date" class="filter-input" style="flex:none; width:150px;">
      <button class="filter-button">検索</button>
    </div>

    <div class="summary-line">全 1,248 件 · 表示: 1〜20件</div>

    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr>
            <th>日時</th>
            <th>ユーザー</th>
            <th>種別</th>
            <th>内容</th>
            <th>IPアドレス</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>3/22 11:45</td>

          </tr>
          <tr>
            <td>3/22 11:30</td>
            <td>みずきさん (#002)</td>

            <td>たろうさん(#001)とマッチング成立</td>
            <td>124.5.62.9</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
