<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-115 メールアドレス変更</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding:20px; }
    .device-frame { width:360px; height:812px; border:1.5px solid #212121; background:#ffffff; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .status-bar { height:20px; background:#212121; }
    .header { display:flex; align-items:center; padding:16px 12px; border-bottom:1px solid #e0e0e0; background:#ffffff; gap:12px; }
    .back-btn { font-size:18px; color:#212121; cursor:pointer; }
    .header-title { font-size:16px; font-weight:bold; }
    
    .content { flex:1; padding:20px; background:#fff; }
    .label { font-size:13px; font-weight:bold; color:#757575; margin-bottom:8px; display:block; }
    .current-val { font-size:14px; color:#212121; margin-bottom:24px; padding:10px; background:#f5f5f5; border-radius:4px; }
    
    .input-field { width:100%; height:44px; padding:0 12px; border:1px solid #e0e0e0; border-radius:4px; font-size:14px; margin-bottom:20px; }
    .input-field:focus { border-color:#212121; outline:none; }
    
    .hint { font-size:12px; color:#757575; line-height:1.5; margin-bottom:32px; }
    
    .submit-btn { display:block; width:100%; padding:14px; background:#212121; color:#fff; text-align:center; border:none; border-radius:4px; font-size:14px; font-weight:bold; cursor:pointer; }
  </style>

  <style>
    :root {
      --wf-global-zoom: 1.1;
    }
    body {
      zoom: var(--wf-global-zoom);
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="status-bar"></div>
    <div class="header">
      <div class="back-btn" onclick="history.back()">←</div>
      <div class="header-title">メールアドレス変更</div>
    </div>

    <div class="content">
      <span class="label">現在のメールアドレス</span>
      <div class="current-val">taro***@example.com</div>

      <span class="label">新しいメールアドレス</span>
      <input type="email" class="input-field" placeholder="example@domain.com">

      <p class="hint">
        変更ボタンをタップすると、新しいメールアドレス宛に確認メールが送信されます。<br>
        メール内のURLをクリックすると変更が完了します。
      </p>

      <button class="submit-btn" onclick="alert('確認メールを送信しました'); history.back();">確認メールを送信する</button>
    </div>
  </div>
</body>
</html>
