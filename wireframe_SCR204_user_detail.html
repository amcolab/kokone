<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-204 Admin User Edit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-item {
      padding: 12px 16px;
      border-left: 3px solid transparent;
      color: #757575;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
    }

    .sidebar-item.active {
      border-left-color: #212121;
      background: #f5f5f5;
      color: #212121;
      font-weight: 600;
    }

    .sidebar-title {
      padding: 12px 16px;
      color: #424242;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 16px;
      margin-bottom: 4px;
    }

    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .content-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 20px;
      font-weight: bold;
      color: #212121;
    }

    .back-link {
      font-size: 13px;
      color: #757575;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      margin-bottom: 24px;
      padding: 24px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 20px;
      border-bottom: 1px solid #f5f5f5;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 40px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #757575;
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      height: 36px;
      border: 1px solid #e0e0e0;
      padding: 0 10px;
      font-size: 13px;
      border-radius: 4px;
      background: #ffffff;
    }

    .form-textarea {
      height: 100px;
      padding: 10px;
      resize: vertical;
    }

    .badge-label {
      font-size: 10px;
      background: #f5f5f5;
      color: #9e9e9e;
      padding: 2px 4px;
      border-radius: 2px;
      margin-left: 4px;
    }

    .section-title-fixed {
      font-size: 11px;
      font-weight: 800;
      color: #bdbdbd;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 32px;
      margin-bottom: 16px;
      padding-left: 4px;
      border-left: 4px solid #bdbdbd;
    }

    .action-bar {
      position: sticky;
      bottom: 20px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      padding: 16px;
      border: 1px solid #e0e0e0;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      z-index: 100;
      margin-top: 40px;
    }

    .btn {
      height: 40px;
      padding: 0 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
    }

    .btn-primary { background: #212121; color: #fff; border: none; }
    .btn-outline { background: #fff; color: #424242; }

  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">ダッシュボード</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR200_admin_dashboard.html'">ダッシュボード</div>

  <div class="sidebar-title">管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR201_activity_mgmt.html'">アクティビティ</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR203_partner_mgmt.html'">店舗・パートナー管理</div>
  <div class="sidebar-item active" onclick="location.href='wireframe_SCR204_user_mgmt.html'">ユーザー管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR206_boshuu_mgmt.html'">募集管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR205_match_mgmt.html'">マッチング管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR210_booking_mgmt.html'">予約管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR220_report_mgmt.html'">通報管理</div>

  <div class="sidebar-title">業績</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR230_revenue.html'">収益管理</div>

  <div class="sidebar-title">システム</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR900_settings.html'">システム設定</div>
</div>

<div class="main-content">
  <div class="content-wrapper">
    <div class="page-header">
      <div class="page-title">ユーザープロフィール編集: たろうさん</div>
      <a href="wireframe_SCR204_user_mgmt.html" class="back-link">← ユーザー一覧へ戻る</a>
    </div>

    <!-- A. 基本情報 -->
    <div class="section-title-fixed">A. 基本情報</div>
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">ニックネーム</label>
          <input type="text" class="form-input" value="たろう">
        </div>
        <div class="form-group">
          <label class="form-label">性別</label>
          <select class="form-select">
            <option selected>男性</option>
            <option>女性</option>
            <option>回答しない</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">生年月日</label>
          <input type="date" class="form-input" value="1986-04-10">
        </div>
        <div class="form-group">
          <label class="form-label">言語</label>
          <input type="text" class="form-input" value="日本語">
        </div>
        <div class="form-group">
          <label class="form-label">居住地 (都道府県)</label>
          <select class="form-select">
            <option selected>東京都</option>
            <option>神奈川県</option>
            <option>千葉県</option>
            <option>埼玉県</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">エリア</label>
          <input type="text" class="form-input" value="渋谷区">
        </div>
        <div class="form-group">
          <label class="form-label">身長 (cm)</label>
          <input type="number" class="form-input" value="175">
        </div>
        <div class="form-group">
          <label class="form-label">体型</label>
          <select class="form-select">
            <option>細め</option>
            <option selected>普通</option>
            <option>がっちり</option>
            <option>ぽっちゃり</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label class="form-label">自己紹介文</label>
          <textarea class="form-textarea">はじめまして。仕事が忙しい毎日ですが、美味しい食事を一緒に楽しめる方と出会えればと思っています。よろしくお願いします。</textarea>
        </div>
      </div>
    </div>

    <!-- B. 職業・経済 -->
    <div class="section-title-fixed">B. 職業・経済</div>
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">職業</label>
          <input type="text" class="form-input" value="IT関連">
        </div>
        <div class="form-group">
          <label class="form-label">年収</label>
          <select class="form-select">
            <option>〜400万</option>
            <option>400〜800万</option>
            <option selected>800〜1000万</option>
            <option>1000万以上</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">学歴</label>
          <select class="form-select">
            <option selected>大学卒業</option>
            <option>大学院卒業</option>
            <option>高校卒業</option>
          </select>
        </div>
      </div>
    </div>

    <!-- C. ライフスタイル -->
    <div class="section-title-fixed">C. ライフスタイル・日常</div>
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">休日</label>
          <input type="text" class="form-input" value="土日祝">
        </div>
        <div class="form-group">
          <label class="form-label">お酒</label>
          <select class="form-select">
            <option>飲まない</option>
            <option selected>飲む</option>
            <option>ときどき飲む</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">タバコ</label>
          <select class="form-select">
            <option selected>吸わない</option>
            <option>吸う</option>
            <option>ときどき吸う</option>
          </select>
        </div>
      </div>
    </div>

    <!-- F. 性格・内面 -->
    <div class="section-title-fixed">F. 性格・内面</div>
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">mbti16タイプ</label>
          <select class="form-select">
            <option value="">未設定</option>
            <option>INTJ</option>
            <option selected>ENTP</option>
            <option>ENFJ</option>
          </select>
        </div>
      </div>
    </div>

    <!-- J. 将来・結婚観 -->
    <div class="section-title-fixed">J. 将来・結婚観</div>
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">結婚願望</label>
          <select class="form-select">
            <option>すぐにでも</option>
            <option selected>良い人がいれば</option>
            <option>今は考えていない</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">子供の希望</label>
          <select class="form-select">
            <option selected>欲しい</option>
            <option>欲しくない</option>
            <option>相手に合わせる</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Admin Specific Operations -->
    <div class="section-title-fixed">管理用設定 (Admin Only)</div>
    <div class="card" style="background: #fff8f8; border-color: #fee;">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">本人確認 (eKYC) 状態</label>
          <select class="form-select">
            <option selected>承認済み (済)</option>
            <option>審査中</option>
            <option>未提出</option>
            <option>否認 (再提出待ち)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">アカウント状態</label>
          <select class="form-select">
            <option selected>正常</option>
            <option>警告中</option>
            <option>利用停止 (BAN)</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label class="form-label">管理用内部メモ</label>
          <textarea class="form-textarea" placeholder="運営内でのみ共有されるメモです..."></textarea>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-outline" onclick="location.href='wireframe_SCR204_user_mgmt.html'">キャンセル</button>
      <button class="btn btn-primary">プロフィールを保存する</button>
    </div>

  </div>
</div>

</body>
</html>
