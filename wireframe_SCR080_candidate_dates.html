<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR-080 Candidate Dates Confirmation</title>
    <style>
        :root { --c0: #fff; --c1: #f5f5f5; --c2: #e0e0e0; --c3: #bdbdbd; --c4: #757575; --c5: #424242; --c6: #212121; }
        body { font-family: sans-serif; background: var(--c1); margin: 0; padding: 20px; }
        .device { width: 360px; height: 812px; border: 1.5px solid var(--c6); background: var(--c0); margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .status-bar { height: 20px; background: var(--c6); color: #fff; font-size: 9px; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; }
        .header { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--c6); gap: 12px; }
        .back-btn { font-size: 14px; cursor: pointer; }
        .header-title { font-size: 16px; font-weight: 600; flex: 1; }
        .content { padding: 12px; flex: 1; overflow-y: auto; }
        
        .candidate-box { margin-bottom: 24px; padding: 16px; border: 1.5px solid var(--c6); background: #fff; }
        .candidate-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
        .candidate-item { display: flex; align-items: center; padding: 14px; border: 1px solid var(--c2); margin-bottom: 10px; cursor: pointer; border-radius: 4px; }
        .candidate-item:hover { border-color: var(--c6); background: var(--c1); }
        .candidate-item.selected { border-width:2px; border-color: var(--c6); background: #eee; }
        .candidate-date { font-size: 13px; font-weight: 600; flex:1; }
        
        .btn-panel { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
        .btn { height: 48px; border: 1.5px solid var(--c6); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #fff; }
        .btn.primary { background: var(--c6); color: #fff; }
        
        .info-pill { padding: 10px; border: 1px dashed var(--c4); font-size: 11px; color: var(--c5); line-height: 1.5; margin-bottom: 15px; background: #fafafa; }

        .app-bottom-nav { height: 60px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; align-items: center; }
        .bn-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #bbb; gap: 4px; }
        .bn-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }
        .bn-item.active { color: #212121; }
        .bn-lbl { font-size: 10px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="device">
        <div class="status-bar"><span>9:41</span><span>●●●●● 100%</span></div>
        <div class="header">
            <div class="back-btn" onclick="window.location.href='wireframe_SCR065_match.html'"><</div>
            <div class="header-title">はなさん</div>
        </div>
        <div class="content">
            <div class="info-pill">
                相手が日程候補を提示しました。どれか一つの日程を選択して「確定する」を押してください。
            </div>

            <div class="candidate-box">
                <div class="candidate-title">提示された候補日</div>
                <div class="candidate-item" onclick="selectDate(this)">
                    <div class="candidate-date">3月28日(木) 19:00〜</div>
                    <div style="font-size: 12px;">○</div>
                </div>
                <div class="candidate-item" onclick="selectDate(this)">
                    <div class="candidate-date">3月29日(金) 19:30〜</div>
                    <div style="font-size: 12px;">○</div>
                </div>
                <div class="candidate-item" onclick="selectDate(this)">
                    <div class="candidate-date">3月30日(土) 18:00〜</div>
                    <div style="font-size: 12px;">○</div>
                </div>
            </div>

            <div class="btn-panel" id="confirmPanel">
                <button class="btn primary" onclick="confirmDate()">この日程で確定する</button>
                <button class="btn" onclick="alert('再度、日程を提案し直します')">別の日程を提案する</button>
            </div>

            <div id="afterConfirm" style="display:none; padding: 20px; border: 2px solid #2e7d32; background: #f1f8f1; color: #1b5e20; text-align: center; border-radius: 8px;">
                <div style="font-size: 18px; margin-bottom: 10px;">✅ 承諾しました</div>
                <div style="font-size: 12px; line-height: 1.5;">事務局がレストランの空き状況を確認し、予約が完了次第、正式なご案内をお送りします。しばらくお待ちください。</div>
                <button class="btn" style="margin-top: 20px; width: 100%;" onclick="window.location.href='wireframe_SCR065_match.html'">マッチング一覧へ戻る</button>
            </div>
        </div>
        
        <script>
            function selectDate(el) {
                document.querySelectorAll('.candidate-item').forEach(item => item.classList.remove('selected'));
                el.classList.add('selected');
            }
            function confirmDate() {
                const selected = document.querySelector('.candidate-item.selected');
                if (!selected) {
                    alert('日程を選択してください');
                    return;
                }
                document.getElementById('confirmPanel').style.display = 'none';
                document.getElementById('afterConfirm').style.display = 'block';
            }
        </script>

        <div class="app-bottom-nav">
          <a class="bn-item" href="#"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="bn-lbl">さがす</span></a>
          <a class="bn-item" href="#"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="bn-lbl">いいね</span></a>
          <a class="bn-item active" href="wireframe_SCR065_match.html"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="bn-lbl">マッチング</span></a>
          <a class="bn-item" href="#"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="bn-lbl">マイページ</span></a>
        </div>
    </div>
</body>
</html>
