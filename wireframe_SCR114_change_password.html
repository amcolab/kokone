<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-114 パスワード変更</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding:20px; }
    .device-frame { width:360px; height:812px; border:1.5px solid #212121; background:#ffffff; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .status-bar { height:20px; background:#212121; }
    .header { display:flex; align-items:center; padding:16px 12px; border-bottom:1px solid #e0e0e0; background:#ffffff; gap:12px; }
    .back-btn { font-size:18px; color:#212121; cursor:pointer; }
    .header-title { font-size:16px; font-weight:bold; }
    .content { flex:1; overflow-y:auto; background:#f5f5f5; padding:16px; }
    .card { background:#fff; border:1px solid #e0e0e0; border-radius:12px; overflow:hidden; }
    .row { padding:14px 14px; border-bottom:1px solid #eee; }
    .row:last-child { border-bottom:none; }
    .label { font-size:12px; color:#757575; margin-bottom:6px; font-weight:700; }
    .input { width:100%; height:40px; border:1px solid #e0e0e0; border-radius:10px; padding:0 12px; font-size:14px; background:#fafafa; }
    .help { margin-top:10px; font-size:11px; color:#757575; line-height:1.6; }
    .actions { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
    .btn { height:44px; border-radius:12px; border:1px solid #e0e0e0; background:#fff; font-weight:800; cursor:pointer; }
    .btn.primary { background:#212121; color:#fff; border-color:#212121; }
    .btn:disabled { opacity:0.45; cursor:not-allowed; }
    .toast { position:absolute; left:50%; transform:translateX(-50%); bottom:18px; background:#212121; color:#fff; padding:10px 14px; border-radius:999px; font-size:12px; display:none; }
    .toast.show { display:block; }
  </style>
  <style>
    :root { --wf-global-zoom: 1.1; }
    body { zoom: var(--wf-global-zoom); }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="status-bar"></div>
    <div class="header">
      <div class="back-btn" onclick="history.back()">←</div>
      <div class="header-title">パスワード変更</div>
    </div>
    <div class="content">
      <div class="card">
        <div class="row">
          <div class="label">新しいパスワード</div>
          <input id="pw1" class="input" type="password" placeholder="8文字以上">
        </div>
        <div class="row">
          <div class="label">新しいパスワード（確認）</div>
          <input id="pw2" class="input" type="password" placeholder="もう一度入力">
        </div>
      </div>
      <div class="help">※ 半角英数字を推奨します。入力が一致したら保存できます。</div>
      <div class="actions">
        <button id="saveBtn" class="btn primary" type="button" disabled>保存する</button>
        <button class="btn" type="button" onclick="history.back()">キャンセル</button>
      </div>
    </div>
    <div id="toast" class="toast">保存しました</div>
  </div>
  <script>
    var pw1 = document.getElementById('pw1');
    var pw2 = document.getElementById('pw2');
    var saveBtn = document.getElementById('saveBtn');
    var toast = document.getElementById('toast');
    var toastTimer = null;

    function updateState() {
      var a = (pw1.value || '').trim();
      var b = (pw2.value || '').trim();
      saveBtn.disabled = !(a.length >= 8 && a === b);
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 1400);
    }

    pw1.addEventListener('input', updateState);
    pw2.addEventListener('input', updateState);
    saveBtn.addEventListener('click', function () {
      showToast('保存しました');
      setTimeout(function () {
        window.location.href = 'wireframe_SCR114_account_mgmt.html';
      }, 650);
    });
  </script>
</body>
</html>
