<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-900 Admin System Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }

    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .content-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 20px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 16px;
      border-bottom: 1px solid #f5f5f5;
      padding-bottom: 8px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #757575;
      margin-bottom: 8px;
    }

    .setting-input {
      width: 100%;
      height: 36px;
      border: 1px solid #e0e0e0;
      padding: 0 10px;
      font-size: 13px;
    }

    .setting-description {
      font-size: 11px;
      color: #9e9e9e;
      margin-top: 4px;
    }

    .save-btn {
      height: 40px;
      background: #212121;
      color: #ffffff;
      border: none;
      padding: 0 24px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
<style>
/* === BUSINESS LOGIC PANEL === */
.blp-wrap{position:fixed;top:0;right:0;width:280px;height:100vh;overflow-y:auto;background:#fff;border-left:2px solid #212121;z-index:9998;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:11px;color:#212121;transition:width 0.2s ease;}
.blp-head{position:sticky;top:0;background:#212121;color:#fff;padding:10px 14px 9px;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;}
.blp-head-scr{font-size:9px;color:#bdbdbd;letter-spacing:.5px;margin-bottom:2px;}
.blp-head-title{font-size:12px;font-weight:700;}
.blp-body{padding:10px 12px 20px;}
.blp-section{margin-bottom:14px;}
.blp-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#9e9e9e;border-bottom:1px solid #f0f0f0;padding-bottom:4px;margin-bottom:7px;}
.blp-note{background:#fafafa;border:1px solid #e0e0e0;border-left:3px solid #bdbdbd;padding:7px 9px;font-size:10px;color:#757575;line-height:1.55;margin-top:6px;}
</style>
<style>
/* === INJECTED SIDEBAR === */
.wf-sidebar{width:200px;min-width:200px;background:#fff;border-right:1px solid #e0e0e0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;}
.wf-sidebar-logo{height:44px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #e0e0e0;gap:8px;}
.wf-logo-mark{width:22px;height:22px;border:2px solid #424242;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#424242;flex-shrink:0;}
.wf-logo-text{font-size:12px;font-weight:700;color:#212121;}
.wf-nav-link{display:flex;align-items:center;gap:5px;padding:5px 14px;font-size:11px;color:#757575;text-decoration:none;border-left:2px solid transparent;line-height:1.3;}
.wf-nav-id{font-size:9px;color:#bdbdbd;width:24px;flex-shrink:0;}
</style>
</head>
<body style="margin-left:200px; margin-right:280px;">
<nav class="wf-sidebar">
  <div class="wf-sidebar-logo"><div class="wf-logo-mark">O</div><span class="wf-logo-text">Otona Table WF</span></div>
  <div class="wf-sidebar-group">
    <div class="wf-group-label">G · Admin</div>
    <a class="wf-nav-link" href="wireframe_SCR200_admin_dashboard.html"><span class="wf-nav-id">200</span>Dashboard</a>
    <a class="wf-nav-link" href="wireframe_SCR204_user_mgmt.html"><span class="wf-nav-id">204</span>User Mgmt</a>
    <a class="wf-nav-link wf-active" href="wireframe_SCR900_settings.html"><span class="wf-nav-id">900</span>Settings</a>
  </div>
</nav>

<div class="main-content">
  <div class="content-wrapper">
    <div class="page-title">システム設定</div>

    <div class="card">
      <div class="card-title">基本設定</div>
      <div class="setting-group">
        <label class="setting-label">サービス名</label>
        <input type="text" class="setting-input" value="Otona Table">
      </div>
      <div class="setting-group">
        <label class="setting-label">運営メールアドレス</label>
        <input type="email" class="setting-input" value="support@otona-table.jp">
      </div>
    </div>

    <div class="card">
      <div class="card-title">マッチング設定</div>
      <div class="setting-group">
        <label class="setting-label">無料会員の1日の「いいね」上限</label>
        <input type="number" class="setting-input" value="5">
      </div>
      <div class="setting-group">
        <label class="setting-label">eKYC必須化</label>
        <select class="setting-input">
          <option selected>ON (マッチングに必須)</option>
          <option>OFF</option>
        </select>
        <div class="setting-description">ONにすると本人確認が完了していないユーザーはメッセージ送信ができなくなります。</div>
      </div>
    </div>

    <button class="save-btn">設定を保存する</button>
  </div>
</div>

<div class="blp-wrap">
  <div class="blp-head">
    <div class="blp-head-info">
      <div class="blp-head-scr">SCR-900</div>
      <div class="blp-head-title">System Settings</div>
    </div>
  </div>
  <div class="blp-body">
    <div class="blp-section">
      <div class="blp-section-title">Mục đích</div>
      <div class="blp-note highlight">Cấu hình các tham số hệ thống mà không cần can thiệp vào code.</div>
    </div>
  </div>
</div>
</body>
</html>
