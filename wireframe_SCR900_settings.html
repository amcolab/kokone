<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-900 Admin System Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-item {
      padding: 12px 16px;
      border-left: 3px solid transparent;
      color: #757575;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
    }

    .sidebar-item.active {
      border-left-color: #212121;
      background: #f5f5f5;
      color: #212121;
      font-weight: 600;
    }

    .sidebar-title {
      padding: 12px 16px;
      color: #424242;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 16px;
      margin-bottom: 4px;
    }

    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .content-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 20px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 16px;
      border-bottom: 1px solid #f5f5f5;
      padding-bottom: 8px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #757575;
      margin-bottom: 8px;
    }

    .setting-input {
      width: 100%;
      height: 36px;
      border: 1px solid #e0e0e0;
      padding: 0 10px;
      font-size: 13px;
    }

    .setting-description {
      font-size: 11px;
      color: #9e9e9e;
      margin-top: 4px;
    }

    .save-btn {
      height: 40px;
      background: #212121;
      color: #ffffff;
      border: none;
      padding: 0 24px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">ダッシュボード</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR200_admin_dashboard.html'">ダッシュボード</div>

  <div class="sidebar-title">管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR201_activity_mgmt.html'">アクティビティ</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR203_partner_mgmt.html'">店舗・パートナー管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR204_user_mgmt.html'">ユーザー管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR206_boshuu_mgmt.html'">募集管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR205_match_mgmt.html'">マッチング管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR210_booking_mgmt.html'">予約管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR220_report_mgmt.html'">通報管理</div>

  <div class="sidebar-title">業績</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR230_revenue.html'">収益管理</div>

  <div class="sidebar-title">システム</div>
  <div class="sidebar-item active" onclick="location.href='wireframe_SCR900_settings.html'">システム設定</div>
</div>

<div class="main-content">
  <div class="content-wrapper">
    <div class="page-title">システム設定</div>

    <div class="card">
      <div class="card-title">基本設定</div>
      <div class="setting-group">
        <label class="setting-label">サービス名</label>
        <input type="text" class="setting-input" value="Otona Table">
      </div>
      <div class="setting-group">
        <label class="setting-label">運営メールアドレス</label>
        <input type="email" class="setting-input" value="support@otona-table.jp">
      </div>
    </div>

    <div class="card">
      <div class="card-title">マッチング・表示設定</div>
      <div class="setting-group">
        <label class="setting-label">1日のサジェスト人数（プラン別）</label>
        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 12px; min-width: 100px; color: #757575;">無料会員:</span>
            <input type="number" class="setting-input" style="width: 120px;" value="10">
            <span style="font-size: 12px; color: #757575;">名/日</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 12px; min-width: 100px; color: #757575;">スタンダード:</span>
            <input type="number" class="setting-input" style="width: 120px;" value="30">
            <span style="font-size: 12px; color: #757575;">名/日</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 12px; min-width: 100px; color: #757575;">プレミアム:</span>
            <input type="number" class="setting-input" style="width: 120px;" value="100">
            <span style="font-size: 12px; color: #757575;">名/日</span>
          </div>
        </div>
        <div class="setting-description">1日に「サジェスト（今日の提案）」として表示されるユーザーの最大数です。</div>
      </div>
    </div>

    <button class="save-btn">設定を保存する</button>
  </div>
</div>
</body>
</html>
