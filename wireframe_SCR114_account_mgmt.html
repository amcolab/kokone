<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-114 アカウント管理</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding:20px; }
    .device-frame { width:360px; height:812px; border:1.5px solid #212121; background:#ffffff; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .status-bar { height:20px; background:#212121; }
    .header { display:flex; align-items:center; padding:16px 12px; border-bottom:1px solid #e0e0e0; background:#ffffff; gap:12px; }
    .back-btn { font-size:18px; color:#212121; cursor:pointer; }
    .header-title { font-size:16px; font-weight:bold; }
    
    .content { flex:1; overflow-y:auto; background:#f5f5f5; }
    
    .section-title { font-size:11px; font-weight:bold; color:#757575; text-transform:uppercase; padding:16px 16px 8px; }
    .menu-group { background:#ffffff; border-top:1px solid #e0e0e0; border-bottom:1px solid #e0e0e0; }
    .menu-row { height:48px; display:flex; justify-content:space-between; align-items:center; padding:0 16px; font-size:14px; color:#212121; border-bottom:1px solid #e0e0e0; background:#fff; cursor:pointer; }
    .menu-row:last-child { border-bottom:none; }
    .menu-value { color:#757575; font-size:13px; }
    .menu-arrow { color:#bdbdbd; font-size:12px; margin-left:8px; }

    .danger-text { color: #c62828; }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="status-bar"></div>
    <div class="header">
      <div class="back-btn" onclick="history.back()">←</div>
      <div class="header-title">アカウント管理</div>
    </div>

    <div class="content">
      <div class="section-title">アカウント情報</div>
      <div class="menu-group">
        <div class="menu-row" onclick="window.location.href='wireframe_SCR115_edit_email.html'">
          <span>メールアドレス</span>
          <span class="menu-value">taro***@example.com <span class="menu-arrow">></span></span>
        </div>
        <div class="menu-row" onclick="window.location.href='wireframe_SCR115_edit_phone.html'">
          <span>電話番号</span>
          <span class="menu-value">090-****-1234 <span class="menu-arrow">></span></span>
        </div>
      </div>

      <div class="section-title">セキュリティ</div>
      <div class="menu-group">
        <div class="menu-row">
          <span>パスワード変更</span>
          <span class="menu-arrow">></span>
        </div>
      </div>

      <div class="section-title">その他</div>
      <div class="menu-group">
        <div class="menu-row" onclick="if(confirm('退会手続きに進みますか？\n実行するとデータはすべて削除されます。')) alert('退会ページへ（未実装）');">
          <span class="danger-text">退会する</span>
          <span class="menu-arrow">></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
