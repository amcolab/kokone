<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-114 退会理由</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding:20px; }
    .device-frame { width:360px; height:812px; border:1.5px solid #212121; background:#ffffff; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .status-bar { height:20px; background:#212121; }
    .header { display:flex; align-items:center; padding:16px 12px; border-bottom:1px solid #e0e0e0; background:#ffffff; gap:12px; }
    .back-btn { font-size:18px; color:#212121; cursor:pointer; }
    .header-title { font-size:16px; font-weight:bold; }
    .content { flex:1; overflow-y:auto; background:#f5f5f5; padding:16px; }
    .card { background:#fff; border:1px solid #e0e0e0; border-radius:12px; overflow:hidden; }
    .section-title { font-size:12px; font-weight:800; color:#424242; padding:14px 14px 10px; border-bottom:1px solid #eee; background:#fafafa; }
    .option { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid #eee; cursor:pointer; }
    .option:last-child { border-bottom:none; }
    .radio { width:18px; height:18px; border-radius:50%; border:2px solid #bdbdbd; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .radio.on { border-color:#212121; }
    .radio.on::after { content:""; width:8px; height:8px; border-radius:50%; background:#212121; }
    .opt-text { font-size:14px; color:#212121; }
    .detail { margin-top:12px; }
    .label { font-size:12px; color:#757575; font-weight:700; margin-bottom:6px; }
    .textarea { width:100%; min-height:110px; border:1px solid #e0e0e0; border-radius:12px; padding:10px 12px; font-size:13px; background:#fafafa; resize:vertical; line-height:1.5; }
    .counter { font-size:11px; color:#9e9e9e; text-align:right; margin-top:6px; }
    .actions { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
    .btn { height:44px; border-radius:12px; border:1px solid #e0e0e0; background:#fff; font-weight:800; cursor:pointer; }
    .btn.primary { background:#c62828; color:#fff; border-color:#c62828; }
    .btn:disabled { opacity:0.45; cursor:not-allowed; }
    .toast { position:absolute; left:50%; transform:translateX(-50%); bottom:18px; background:#212121; color:#fff; padding:10px 14px; border-radius:999px; font-size:12px; display:none; }
    .toast.show { display:block; }
  </style>
  <style>
    :root { --wf-global-zoom: 1.1; }
    body { zoom: var(--wf-global-zoom); }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="status-bar"></div>
    <div class="header">
      <div class="back-btn" onclick="history.back()">←</div>
      <div class="header-title">退会理由</div>
    </div>
    <div class="content">
      <div class="card">
        <div class="section-title">退会理由を選択してください</div>
        <div class="option" onclick="selectReason('使い方が難しい', this)"><div class="radio"></div><div class="opt-text">使い方が難しい</div></div>
        <div class="option" onclick="selectReason('良い出会いがなかった', this)"><div class="radio"></div><div class="opt-text">良い出会いがなかった</div></div>
        <div class="option" onclick="selectReason('通知が多い', this)"><div class="radio"></div><div class="opt-text">通知が多い</div></div>
        <div class="option" onclick="selectReason('料金が高い', this)"><div class="radio"></div><div class="opt-text">料金が高い</div></div>
        <div class="option" onclick="selectReason('しばらく利用しない', this)"><div class="radio"></div><div class="opt-text">しばらく利用しない</div></div>
      </div>

      <div class="detail">
        <div class="label">詳細（任意）</div>
        <textarea id="detail" class="textarea" maxlength="300" placeholder="改善のため、差し支えなければ理由を教えてください。"></textarea>
        <div id="counter" class="counter">0/300</div>
      </div>

      <div class="actions">
        <button id="withdrawBtn" class="btn primary" type="button" disabled>退会する</button>
        <button class="btn" type="button" onclick="history.back()">キャンセル</button>
      </div>
    </div>
    <div id="toast" class="toast">退会手続きを送信しました</div>
  </div>

  <script>
    var selectedReason = '';
    var toastTimer = null;
    var withdrawBtn = document.getElementById('withdrawBtn');
    var toast = document.getElementById('toast');
    var detail = document.getElementById('detail');
    var counter = document.getElementById('counter');

    function updateCounter() {
      counter.textContent = (detail.value || '').length + '/300';
    }

    function selectReason(reason, el) {
      selectedReason = reason;
      document.querySelectorAll('.option .radio').forEach(function (r) { r.classList.remove('on'); });
      var radio = el.querySelector('.radio');
      if (radio) radio.classList.add('on');
      withdrawBtn.disabled = !selectedReason;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 1400);
    }

    detail.addEventListener('input', updateCounter);
    updateCounter();

    withdrawBtn.addEventListener('click', function () {
      showToast('退会手続きを送信しました');
      setTimeout(function () {
        window.location.href = 'wireframe_SCR020_login.html';
      }, 650);
    });
  </script>
</body>
</html>
