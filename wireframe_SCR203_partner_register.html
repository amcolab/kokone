<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCR-203 Admin Partner Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-item {
      padding: 12px 16px;
      border-left: 3px solid transparent;
      color: #757575;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
    }

    .sidebar-item.active {
      border-left-color: #212121;
      background: #f5f5f5;
      color: #212121;
      font-weight: 600;
    }

    .sidebar-title {
      padding: 12px 16px;
      color: #424242;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 16px;
      margin-bottom: 4px;
    }

    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .content-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 20px;
      font-weight: bold;
      color: #212121;
    }

    .back-link {
      font-size: 13px;
      color: #757575;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 20px;
      border-bottom: 1px solid #f5f5f5;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #757575;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 38px;
      border: 1px solid #e0e0e0;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 4px;
    }

    .form-textarea {
      width: 100%;
      height: 100px;
      border: 1px solid #e0e0e0;
      padding: 12px;
      font-size: 13px;
      border-radius: 4px;
      resize: vertical;
    }

    .form-select {
      width: 100%;
      height: 38px;
      border: 1px solid #e0e0e0;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 4px;
      background: #ffffff;
    }

    .photo-upload-placeholder {
      width: 100%;
      height: 120px;
      border: 2px dashed #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9e9e9e;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      background: #fafafa;
    }

    .photo-upload-placeholder:hover {
      background: #f5f5f5;
      border-color: #bdbdbd;
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      height: 40px;
      padding: 0 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-outline {
      border: 1px solid #e0e0e0;
      background: #ffffff;
      color: #424242;
    }

    .btn-primary {
      background: #212121;
      color: #ffffff;
      border: none;
    }

    .required-badge {
      font-size: 10px;
      background: #d32f2f;
      color: #ffffff;
      padding: 2px 4px;
      border-radius: 2px;
      margin-left: 6px;
      vertical-align: middle;
    }

  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">ダッシュボード</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR200_admin_dashboard.html'">ダッシュボード</div>

  <div class="sidebar-title">管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR201_activity_mgmt.html'">アクティビティ</div>
  <div class="sidebar-item active" onclick="location.href='wireframe_SCR203_partner_mgmt.html'">店舗・パートナー管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR204_user_mgmt.html'">ユーザー管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR206_boshuu_mgmt.html'">募集管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR205_match_mgmt.html'">マッチング管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR210_booking_mgmt.html'">予約管理</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR220_report_mgmt.html'">通報管理</div>

  <div class="sidebar-title">業績</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR230_revenue.html'">収益管理</div>

  <div class="sidebar-title">システム</div>
  <div class="sidebar-item" onclick="location.href='wireframe_SCR900_settings.html'">システム設定</div>
</div>

<div class="main-content">
  <div class="content-wrapper">
    <div class="page-header">
      <div class="page-title">新規店舗登録</div>
      <a href="wireframe_SCR203_partner_mgmt.html" class="back-link">← 店舗一覧へ戻る</a>
    </div>

    <div class="card">
      <div class="card-title">基本情報</div>
      
      <div class="form-group">
        <label class="form-label">店舗名 <span class="required-badge">必須</span></label>
        <input type="text" class="form-input" placeholder="例: 個室ダイニング Otona 恵比寿店">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">エリア <span class="required-badge">必須</span></label>
          <select class="form-select">
            <option value="">エリアを選択してください</option>
            <option>恵比寿</option>
            <option>西麻布</option>
            <option>銀座</option>
            <option>六本木</option>
            <option>新宿</option>
            <option>渋谷</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">ジャンル <span class="required-badge">必須</span></label>
          <select class="form-select">
            <option value="">ジャンルを選択してください</option>
            <option>創作和食</option>
            <option>イタリアン</option>
            <option>フレンチ</option>
            <option>懐石料理</option>
            <option>ビストロ</option>
            <option>カフェ/バー</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">住所 <span class="required-badge">必須</span></label>
        <input type="text" class="form-input" placeholder="東京都渋谷区...">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">電話番号</label>
          <input type="text" class="form-input" placeholder="03-XXXX-XXXX">
        </div>
        <div class="form-group">
          <label class="form-label">平均予算 (ランチ/ディナー)</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" class="form-input" placeholder="5,000">
            <span>〜</span>
            <input type="text" class="form-input" placeholder="15,000">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">店舗詳細・写真</div>
      
      <div class="form-group">
        <label class="form-label">店舗紹介文</label>
        <textarea class="form-textarea" placeholder="店舗の特徴や雰囲気を入力してください..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">営業時間・定休日</label>
        <textarea class="form-textarea" style="height: 60px;" placeholder="例: 17:00〜23:00 (L.O. 22:00) / 定休日: 月曜日"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">店舗写真</label>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
          <div class="photo-upload-placeholder">
            <span>+</span>
            <span>メイン等</span>
          </div>
          <div class="photo-upload-placeholder">
            <span>+</span>
            <span>内装</span>
          </div>
          <div class="photo-upload-placeholder">
            <span>+</span>
            <span>料理</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">管理・連携設定</div>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">担当者名</label>
          <input type="text" class="form-input" placeholder="例: 佐藤">
        </div>
        <div class="form-group">
          <label class="form-label">ステータス <span class="required-badge">必須</span></label>
          <select class="form-select">
            <option>正常 (公開中)</option>
            <option>準備中 (非公開)</option>
            <option>停止中</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">管理用メモ</label>
        <textarea class="form-textarea" style="height: 60px;" placeholder="契約条件や連絡時の注意点など..."></textarea>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-outline" onclick="location.href='wireframe_SCR203_partner_mgmt.html'">キャンセル</button>
      <button class="btn btn-primary">店舗を登録する</button>
    </div>

  </div>
</div>

</body>
</html>
